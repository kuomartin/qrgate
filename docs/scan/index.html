<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QRGate 入場掃描</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <iframe id="gas-bridge" style="display: none"></iframe>

    <div id="url-warning" class="banner banner-warning" style="display: none">
      缺少部署 ID！請確認網址結尾包含 <code>?id=您的部署ID</code>
    </div>

    <div class="container">
      <h1>QRGate 入場掃描</h1>

      <div id="connection-status" class="status-pill">
        <span id="connection-status-text">Bridge 連線中</span>
      </div>

      <div class="field">
        <label for="gate-id">閘道代號</label>
        <input
          type="text"
          id="gate-id"
          placeholder="例如：入口 A"
          autocomplete="off"
        />
      </div>

      <div id="video-container" style="display: none">
        <div id="qr-reader"></div>
      </div>

      <div class="controls">
        <button id="start-button">開始掃描</button>
        <button id="flip-button" disabled>切換鏡頭</button>
      </div>

      <div id="result-banner" class="banner" style="display: none"></div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
